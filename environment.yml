name: DA4CHE
channels:
  - conda-forge
  - defaults

dependencies:
  - python=3.10
  - pip
  - jupyter
  - jupyterlab
  - jupyter-book<2  # pin to Sphinx-based 1.x; 2.x uses myst-cli and is incompatible with _config.yml/_toc.yml
  - sphinx-exercise  # provides the :::{exercise} directive
  - jupytext
  - myst-parser
  - ipykernel
  - nbconvert
  - matplotlib  # Optional: include any common packages your lectures use
  - numpy
  - pandas
  - autograd
  - scikit-learn
  - statsmodels
  - seaborn
  - pandas
  - openpyxl
  - pytest
  - nbmake
  - pip:
      - ghp-import  # for manual GitHub Pages deployment

