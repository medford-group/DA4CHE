# Book settings
title: "Data Analytics for Chemical Engineers"
author: "A.J. Medford"
#logo: "images/logo.png"

only_build_toc_files: true

exclude_patterns:
  - "_build"
  - "_trash"
  # `make test` copies the book into build/nbtest/work to execute it, and the pytest
  # cache left behind there is otherwise read as an orphan page. Without this, any build
  # run after a test run reports a warning that has nothing to do with the book.
  - "build"
  - "build/**"
  - "**/.ipynb_checkpoints"
  - ".venv"
  - ".venv/**"
  - "venv"
  - "venv/**"
  - "env"
  - "env/**"
  - "**/site-packages/**"
  - "node_modules"
  - "node_modules/**"

# Execution settings
execute:
  execute_notebooks: "auto" # or force or off
  timeout: 600
  cache: "default"
  cache_path: _exec_cache
  in_temp: false
  allow_errors: false

# Enable notebook downloads (.ipynb)
mystnb:
  notebooks_download: true

# Launch buttons (optional, for Binder or JupyterHub)
#launch_buttons:
#  notebook_interface: classic
#  binderhub_url: "https://mybinder.org"
#  thebe: false

# HTML-specific options
html:
#  favicon: "images/favicon.ico"
  navbar_number_sections: true
#  use_edit_page_button: true
  extra_navbar: ""
  extra_footer: '© 2026 A.J. Medford · <a href="https://creativecommons.org/licenses/by/4.0/">CC BY 4.0</a>'
  home_page_in_navbar: true

  # Both of the following are set by scripts/release.py (DA4CHE-manager) for the
  # duration of a release build, then restored. Leave them empty on `main`:
  #
  #   announcement -- names the edition and patch level being read. Empty here so the
  #     development build carries no edition claim; a published edition always states
  #     which one it is, because a patch republishes an edition in place.
  #   baseurl -- the edition's own URL, so a published copy does not advertise the
  #     development site as its canonical location.
  announcement: ""
  baseurl: ""

# Sphinx extensions
sphinx:
  extra_extensions:
    - sphinx_exercise  # enables :::{exercise} directive
  local_extensions:
    # Adds a `.ipynb` entry to each page's Download badge. sphinx-book-theme supports
    # this natively but only sets it up inside its Binder/Colab launch-button code, so a
    # book without launch buttons never offers the notebook. See _ext/ipynb_download.py.
    ipynb_download: _ext/
    # Restarts the exercise counter at 1 on each problem_sets/ page. Sphinx keeps one
    # numfig counter for the whole book, so the five exercises of a problem set were
    # numbered 142-146. See _ext/exercise_numbering.py.
    exercise_numbering: _ext/
  config:
    # jupyter-book leaves html_static_path unset, so this is additive rather than a
    # override of theme assets (verified against the resolved config).
    html_static_path:
      - _static
    # Adds an "other versions" control to every page. Reads the published version
    # index at an absolute path, so an already-published edition still discovers
    # editions released after it. No-ops when that index is unreachable, which is the
    # case for local builds and the development site.
    html_js_files:
      - version-switcher.js

# Add custom CSS or JS if needed
#extra_css:
#  - custom.css
